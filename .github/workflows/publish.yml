name: publish

# 推到 main：检查条目和老插件；legacy/ 里升了版本的老插件打包、发 Release，条目指过去；
# 用条目生成 index.json，传到 index 这个 Release（Win顺 的插件库读它，网址不变）；更新 README 的插件表。
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "legacy/**"
      - "tools/**"
      - "keys/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish # the updater uses it too
  cancel-in-progress: false

jobs:
  desktop:
    if: github.repository == 'LingCore/WinShun-plugins'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Prepare the pinned desktop build runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/desktop -Force | Out-Null
          $archive = Join-Path $PWD 'build/desktop/python.tar.gz'
          Invoke-WebRequest 'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.15.2%2B20261026-x86_64-pc-windows-msvc-install_only_stripped.tar.gz' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '02e532b60e720aa3d77e757c349ae9cc945441c05851fa646336fc9ff0403041') {
            throw 'Python runtime checksum mismatch'
          }
          tar -xf $archive -C build/desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/desktop/python/python.exe -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/desktop-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build and verify new desktop versions
        shell: pwsh
        run: |
          & ./build/desktop/python/python.exe -I tools/build_desktop.py day.ocr day.rename --pending --build-dir build/desktop/work --out dist/desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-plugins
          path: dist/desktop/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.repository == 'LingCore/WinShun-plugins'
    needs: desktop
    runs-on: ubuntu-latest
    environment: index-signing # holds INDEX_SIGNING_KEYS; only main may use it
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest main, not the pushed commit: the updater may have pushed while this run was
          # waiting, and an index.json built from the older commit would take its updates back out.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the official native package boundary
        run: python -I -m unittest discover -s tools -p test_native.py

      - name: Install the signing library (pinned)
        run: python -m pip install --disable-pip-version-check "cryptography==49.0.0"

      - name: Test the index signing tool
        run: python -I -m unittest discover -s tools -p test_sign.py

      - name: Check the entries and the legacy plugins
        run: python -I tools/check.py

      - name: Check the entries this push changed against their packages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            mapfile -t ids < <(git diff --name-only --no-renames --diff-filter=AM "$BEFORE" HEAD -- plugins \
              | sed -nE 's#^plugins/([^/]+)\.json$#\1#p')
            if [ "${#ids[@]}" -eq 0 ]; then
              echo "no entry changed"
              exit 0
            fi
            python -I tools/check.py --online "${ids[@]}"
          else
            python -I tools/check.py --online
          fi

      - name: Pack the legacy plugins
        run: python -I tools/build.py --legacy --out dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-plugins
          path: dist/desktop

      - name: Verify and include the Windows desktop packages
        run: |
          python -I - <<'PY'
          import hashlib
          import io
          import json
          import shutil
          import sys
          import zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import check
          import registry
          source = Path('dist/desktop')
          rows = []
          for line in (source / 'desktop.tsv').read_text(encoding='utf-8').splitlines():
              pid, version, filename, digest, name = line.split('\t')
              data = (source / filename).read_bytes()
              package = check.check_package(data, pid, version, filename, unreviewed_native=True)
              if package.errors:
                  raise SystemExit('\n'.join(package.errors))
              receipt = registry.load_json(source / f'{pid}-{version}.build.json')
              if hashlib.sha256(data).hexdigest() != digest or receipt['sha256'] != digest:
                  raise SystemExit(f'{pid}: artifact checksum mismatch')
              if (source / f'{filename}.sha256').read_text(encoding='ascii').split()[0] != digest:
                  raise SystemExit(f'{pid}: checksum attachment mismatch')
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  embedded = json.loads(archive.read('build-info.json'))
              for key in ('id', 'version', 'sourceCommit', 'sourceSha256', 'toolchain', 'requirementsSha256'):
                  if embedded[key] != receipt[key]:
                      raise SystemExit(f'{pid}: build receipt differs from package')
              if receipt['review'] != 'unreviewed-native' or not receipt['selfTest']['ok']:
                  raise SystemExit(f'{pid}: desktop validation receipt missing')
              published = registry.load_json(Path('plugins') / f'{pid}.json')['version']
              if registry.version_key(version) <= registry.version_key(published):
                  continue
              shutil.copyfile(source / filename, Path('dist') / filename)
              rows.append(line + '\n')
          with Path('dist/legacy.tsv').open('ab') as output:
              output.write(''.join(rows).encode('utf-8'))
          PY

      - name: Release the legacy versions that have no release yet
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          fail=0
          mkdir -p old
          while IFS=$'\t' read -r id version file sha name; do
            tag="$id-v$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              rm -f "old/$file"
              if gh release download "$tag" -p "$file" -D old; then
                old=$(sha256sum "old/$file" | cut -d' ' -f1)
                if [ "$old" != "$sha" ]; then
                  echo "::error::$tag was released with other contents. Bump the version in legacy/$id/plugin.json."
                  fail=1
                fi
              else
                echo "::error::$tag exists but has no $file."
                fail=1
              fi
            else
              target="$head"
              assets=("dist/$file")
              notes="Win顺 设置 → 插件 → 从压缩包安装，选这个 .wsplugin 文件。"
              if [ -f "dist/desktop/$id-$version.build.json" ]; then
                target=$(jq -r .sourceCommit "dist/desktop/$id-$version.build.json")
                git cat-file -e "$target^{commit}"
                assets+=("dist/desktop/$file.sha256" "dist/desktop/$id-$version.build.json")
                notes="$notes 需要 Win顺 0.22.0 及以上版本。运行时和依赖随包提供，按未审核原生插件收录，安装和每次更新需确认。源码提交为 $target，构建收据及 SHA256 随附件提供。"
              fi
              gh release create "$tag" "${assets[@]}" \
                --target "$target" --latest=false \
                --title "$name $version" \
                --notes "$notes"
            fi
          done < dist/legacy.tsv
          if [ "$fail" -ne 0 ]; then exit 1; fi

      - name: Point the legacy entries at their releases
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r id version file _ _; do
            if [ "$(jq -r .version "plugins/$id.json")" != "$version" ]; then
              review=()
              if [ -f "dist/desktop/$id-$version.build.json" ]; then
                review+=(--unreviewed-native)
              fi
              python -I tools/entry.py "https://github.com/$GITHUB_REPOSITORY/releases/download/$id-v$version/$file" "${review[@]}"
            fi
          done < dist/legacy.tsv

      # What 说明 shows in Win顺's 插件库 before installing: each package's README.md, kept beside
      # index.json as readme-<id>-<version>.md. Those already on the release are reused, not fetched again.
      - name: Collect the plugins' READMEs
        run: |
          set -euo pipefail
          mkdir -p dist/readmes-live
          gh release download index -p 'readme-*.md' -D dist/readmes-live 2> /dev/null || true
          python -I tools/readmes.py --have dist/readmes-live --out dist/readmes

      - name: Build index.json and the README table
        run: python -I tools/index.py --out dist --readme --readmes dist/readmes

      # The only step that sees the private key(s). Writes dist/index.json.sig and verifies it against keys/*.pub.
      - name: Sign index.json
        env:
          INDEX_SIGNING_KEYS: ${{ secrets.INDEX_SIGNING_KEYS }}
        run: python -I tools/sign_index.py sign dist/index.json

      - name: Commit the entries and the README table if they changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md plugins; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md plugins
          git commit -m "Registry: entries for new legacy releases, plugin table [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # Before index.json, which names them. Then the ones no entry names any more go.
      - name: Upload the READMEs to the "index" release
        run: |
          set -euo pipefail
          if ! gh release view index > /dev/null 2>&1; then
            gh release create index --target "$(git rev-parse HEAD)" --latest=false \
              --title "index" --notes "Plugin index, rewritten by CI on every publish. Do not edit."
          fi
          shopt -s nullglob
          for f in dist/readmes/readme-*.md; do
            if [ ! -f "dist/readmes-live/$(basename "$f")" ]; then
              gh release upload index "$f" --clobber
            fi
          done
          for f in dist/readmes-live/readme-*.md; do
            if [ ! -f "dist/readmes/$(basename "$f")" ]; then
              gh release delete-asset index "$(basename "$f")" --yes
            fi
          done

      - name: Upload index.json to the "index" release
        run: |
          set -euo pipefail
          if ! gh release view index > /dev/null 2>&1; then
            gh release create index --target "$(git rev-parse HEAD)" --latest=false \
              --title "index" --notes "Plugin index, rewritten by CI on every publish. Do not edit."
          fi
          gh release upload index dist/index.json dist/index.json.sig --clobber
