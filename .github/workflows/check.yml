name: check

# 投稿的 PR 只能改 plugins/<id>.json（和 legacy/ 里已有的老插件）。
# 检查用的是基础分支上的工具（PR 改不到它），条目指向的包会下载下来重新算一遍；
# 只读的令牌，不运行插件的代码。审核要看的权限表写在运行摘要里。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The pull request, merged onto its base
        uses: actions/checkout@v4
        with:
          path: pr
          fetch-depth: 2 # HEAD^1 is the base it was merged onto
          persist-credentials: false

      - name: The checker, from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python -I base/tools/check.py --root pr --pr HEAD^1 --summary summary.md
          else
            python -I base/tools/check.py --root pr --online --summary summary.md
          fi

      - name: Summary for the reviewer
        if: always()
        run: if [ -f summary.md ]; then cat summary.md >> "$GITHUB_STEP_SUMMARY"; fi
